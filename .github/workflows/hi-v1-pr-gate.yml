name: HI_V1 PR Gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  hi-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Enforce HI_V1 PR telemetry
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/validate_hi_v1_pr.cjs --self-test
          node .github/scripts/validate_hi_v1_pr.cjs
